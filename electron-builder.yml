appId: go.plkhealth.dcsync
productName: DcSync
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: DcSync
  target: nsis
nsis:
  # ชื่อคงที่ — ลิงก์ releases/latest/download/DcSync-Setup.exe (ปุ่มในเว็บ dc) ได้เวอร์ชันล่าสุดเสมอ
  artifactName: DcSync-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# อัปเดตอัตโนมัติจาก GitHub Releases (repo public — ไม่ต้องฝัง token ในโปรแกรม)
# ปล่อยเวอร์ชันใหม่: แก้ version ใน package.json แล้ว GH_TOKEN=... npm run release
# release = build (--publish never) แล้วค่อย `electron-builder publish` แยก: --publish always ตอน build
# สร้าง publisher 2 ตัวพร้อมกัน (exe กับ blockmap) → ยิงสร้าง release ซ้อน 2 อัน (422 หรือ release ซ้ำแท็ก, exe แยกไปอีกอัน)
# ponytail: เลี่ยง race ใน electron-builder 26.15.3; ถ้า `publish` error มันจะ log "error publishing" แต่ exit 0 — ดู log/asset ทุกครั้ง
publish:
  provider: github
  owner: tehnplk
  repo: DcSync
  releaseType: release
